[build]
  command = "npm run build"
  publish = "dist"

# The app uses client-side routes (/food, /body, ...). Send any path that isn't a real file to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or updates won't reach installed copies.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
